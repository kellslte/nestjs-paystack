name: Publish Package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Read package metadata
        id: package
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "Package: $PACKAGE_NAME@$PACKAGE_VERSION"

      - name: Check whether this version is already on npm
        id: release-check
        run: |
          PUBLISHED_VERSION=$(npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version 2>/dev/null || true)

          if [ "$PUBLISHED_VERSION" = "${{ steps.package.outputs.version }}" ]; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "reason=Version ${{ steps.package.outputs.version }} is already published to npm." >> $GITHUB_OUTPUT
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "reason=Version ${{ steps.package.outputs.version }} is not yet published to npm." >> $GITHUB_OUTPUT
          fi

      - name: Log publish decision
        run: |
          echo "${{ steps.release-check.outputs.reason }}"

      - name: Run linting
        if: steps.release-check.outputs.should_publish == 'true'
        run: npm run lint

      - name: Check formatting
        if: steps.release-check.outputs.should_publish == 'true'
        run: npm run format:check

      - name: Run tests
        if: steps.release-check.outputs.should_publish == 'true'
        run: npm test

      - name: Build package
        if: steps.release-check.outputs.should_publish == 'true'
        run: npm run build

      - name: Ensure release tag exists locally
        if: steps.release-check.outputs.should_publish == 'true'
        run: |
          if git rev-parse "${{ steps.package.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.package.outputs.tag }} already exists locally."
          else
            git tag "${{ steps.package.outputs.tag }}"
            echo "Created local tag ${{ steps.package.outputs.tag }}."
          fi

      - name: Publish to npm
        if: steps.release-check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tag
        if: steps.release-check.outputs.should_publish == 'true'
        run: |
          if git ls-remote --tags origin "${{ steps.package.outputs.tag }}" | grep -q "${{ steps.package.outputs.tag }}"; then
            echo "Tag ${{ steps.package.outputs.tag }} already exists on origin."
          else
            git push origin "${{ steps.package.outputs.tag }}"
            echo "Pushed tag ${{ steps.package.outputs.tag }}."
          fi

      - name: Create GitHub release
        if: steps.release-check.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: Release ${{ steps.package.outputs.tag }}
          generate_release_notes: true
